site_name: Metacognition
site_description: A Claude plugin that captures how you judge your work and turns it into a skill.
site_url: https://masonegger.github.io/metacognition-plugin/
repo_url: https://github.com/MasonEgger/metacognition-plugin
repo_name: MasonEgger/metacognition-plugin

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - "."
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - The Five Stages:
      - Overview: stages/index.md
      - Design: stages/design.md
      - Interview: stages/interview.md
      - Compile: stages/compile.md
      - Calibrate: stages/calibrate.md
      - Skillify: stages/skillify.md
  - Configuration: configuration.md
  - The Method: method.md
  - Privacy: privacy.md
  - File Formats:
      - Overview: formats/index.md
      - interview-spec.md: formats/interview-spec.md
      - archive.md: formats/archive.md
      - profile.md: formats/profile.md
      - Calibration Round Files: formats/calibration-round.md
  - Surface Check: surface-check.md
