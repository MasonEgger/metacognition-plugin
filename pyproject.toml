[project]
name = "metacognition-plugin"
version = "0.1.1"
description = "Dev tooling for the metacognition Claude plugin. Not published."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pyyaml",
    "types-PyYAML",
    "mkdocs",
    "mkdocs-material",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "TC"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/scripts", "tools", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
